name: correspondencia-deploy
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    user: '10001:10001'
    working_dir: /app
    env_file:
      - path: ${RUNTIME_ENV_FILE:-.env}
        format: raw
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: ''
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      STORAGE_ROOT: /app/storage
      PYTHONDONTWRITEBYTECODE: '1'
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '172.30.237.10']
    expose: ['8000']
    volumes: [backend_storage:/app/storage]
    networks:
      edge:
        ipv4_address: 172.30.237.11
      data:
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=128m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, python, -B, -c, 'import json,urllib.request; d=json.load(urllib.request.urlopen("http://127.0.0.1:8000/health/database", timeout=4)); raise SystemExit(0 if d.get("status")=="ok" and d.get("database")=="connected" else 1)']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    stop_grace_period: 30s

  web:
    build: ./web
    restart: unless-stopped
    init: true
    user: '10001:10001'
    ports: ['127.0.0.1:8080:8080']
    networks:
      edge:
        ipv4_address: 172.30.237.10
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=64m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '4', http://127.0.0.1:8080/index.html]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    stop_grace_period: 30s

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.237.0/28
  data:
    internal: true
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME:-correspondencia_sipe_sipe_postgres_data}
  backend_storage:
    external: true
    name: ${STORAGE_VOLUME:-correspondencia_sipe_sipe_backend_storage}
